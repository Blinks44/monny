changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - renovate

  categories:
    - title: Added
      labels:
        - feature
        - enhancement
    - title: Fixed
      labels:
        - bug
        - fix
    - title: Changed
      labels:
        - refactor
        - ux
        - ui
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Maintenance
      labels:
        - chore
        - ci
        - dependencies
    - title: Other Changes
      labels:
        - "*"
