name: Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v1.8.2)"
        required: true
        type: string

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-cask:
    name: Update Blinks44/homebrew-tap cask
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve tag and DMG checksum
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi
          version="${tag#v}"
          mkdir -p release-sums
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "SHA256SUMS.txt" --dir release-sums
          sha256="$(awk '$2 == "Monny.dmg" { print $1; exit }' release-sums/SHA256SUMS.txt)"
          if [ -z "$sha256" ]; then
            echo "::error::Missing Monny.dmg in SHA256SUMS.txt for $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Commit and push Casks/monny.rb to Blinks44/homebrew-tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY secret is not set; skipping Blinks44/homebrew-tap update"
            exit 0
          fi
          key_file="$RUNNER_TEMP/homebrew_tap_key"
          known_hosts="$RUNNER_TEMP/github_known_hosts"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key_file"
          ssh-keyscan -t ed25519 github.com > "$known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          git clone git@github.com:Blinks44/homebrew-tap.git tap
          mkdir -p tap/Casks
          bash .github/scripts/render-homebrew-cask.sh "$VERSION" "$SHA256" > tap/Casks/monny.rb
          cd tap
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Casks/monny.rb is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/monny.rb
          git commit -m "cask: update monny to ${VERSION}"
          git push origin HEAD
